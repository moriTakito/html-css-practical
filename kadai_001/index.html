<!DOCTYPE html>
<html>
<!-- ヘッダー -->

<head>
  <title>MyProfile</title>
  <meta charset="UTF-8">
  <meta name="description" content="Kazuki Asahinaの自己紹介と趣味のカメラで撮影した写真を掲載しているサイトです。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <!-- Webフォント  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Noto+Sans+JP&display=swap"
    rel="stylesheet">
</head>
<!-- ボディ -->

<body>
  <header>
    <div class="header-inner">
      <!-- ロゴ -->
      <h1>
        <a href="index.html" class="home"> My Profile </a>
      </h1>
      <!-- ナビゲーション -->
      <nav id="nav-pc">
        <ul>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#works">Works</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <article>
      <!-- メインビジュアル -->
      <section id="main-visual">
        <img src="images/main.png" alt="カメラ">
      </section>
      <!-- About -->
      <section id="about">
        <h2 class="index-h2">About</h2>
        <div class="about-flex">
          <img src="images/about.png" alt="自画像">
          <div id="about-word">
            <h3>Kazuki Asahina</h3>
            <ul>
              <li>
                <p>25歳 長野県佐久市出身</p>
              </li>
              <li>
                <p>ソフトウェア業界でマーケティングに従事</p>
              </li>
              <li>
                <p>趣味はカメラ、愛機はCanon</p>
              </li>
              <li>
                <p>自然を撮影するのが好きで、海や山によく行く</p>
              </li>
            </ul>
          </div>
        </div>
      </section>
      <!-- Works -->
      <section id="works">
        <h2 class="index-h2">Works</h2>
        <div class="works-flex">
          <div class="work">
            <img src="images/works1.png" alt="写真1">
            <p>新潟に訪れた際に、日本海の雄大さに魅了されえ撮影した1枚</p>
          </div>
          <div class="work">
            <img src="images/works2.png" alt="写真2">
            <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
          </div>
          <div class="work">
            <img src="images/works3.png" alt="写真3">
            <p>京都で撮影した、明け方の古き良き日本の街並み</p>
          </div>
        </div>
      </section>
      <!-- フッター -->
      <footer>
        <p id="copyright">&copy;MyProfile. All Rights Reserved.</p>
      </footer>
    </article>
  </main>

</body>

</html>
